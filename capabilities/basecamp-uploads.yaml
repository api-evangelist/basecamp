naftiko: 1.0.0-alpha2
info:
  label: Basecamp API — Uploads
  description: 'Basecamp API — Uploads. 4 operations. Lead operation: Get an upload. Self-contained Naftiko capability covering
    one Basecamp business surface.'
  tags:
  - Basecamp
  - Uploads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BASECAMP_API_KEY: BASECAMP_API_KEY
capability:
  consumes:
  - type: http
    namespace: basecamp-uploads
    baseUri: https://3.basecampapi.com/{accountId}
    description: Basecamp API — Uploads business capability. Self-contained, no shared references.
    resources:
    - name: uploads-uploadId}.json
      path: /uploads/{uploadId}.json
      operations:
      - name: getupload
        method: GET
        description: Get an upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateupload
        method: PUT
        description: Update an upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: vaults-vaultId-uploads.json
      path: /vaults/{vaultId}/uploads.json
      operations:
      - name: listuploads
        method: GET
        description: List uploads
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createupload
        method: POST
        description: Create an upload
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.BASECAMP_API_KEY}}'
  exposes:
  - type: rest
    namespace: basecamp-uploads-rest
    port: 8080
    description: REST adapter for Basecamp API — Uploads. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/uploads/uploadid-json
      name: uploads-uploadid-json
      description: REST surface for uploads-uploadId}.json.
      operations:
      - method: GET
        name: getupload
        description: Get an upload
        call: basecamp-uploads.getupload
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateupload
        description: Update an upload
        call: basecamp-uploads.updateupload
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/vaults/{vaultid}/uploads-json
      name: vaults-vaultid-uploads-json
      description: REST surface for vaults-vaultId-uploads.json.
      operations:
      - method: GET
        name: listuploads
        description: List uploads
        call: basecamp-uploads.listuploads
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createupload
        description: Create an upload
        call: basecamp-uploads.createupload
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: basecamp-uploads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Basecamp API — Uploads. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-upload
      description: Get an upload
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: basecamp-uploads.getupload
      outputParameters:
      - type: object
        mapping: $.
    - name: update-upload
      description: Update an upload
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: basecamp-uploads.updateupload
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-uploads
      description: List uploads
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: basecamp-uploads.listuploads
      outputParameters:
      - type: object
        mapping: $.
    - name: create-upload
      description: Create an upload
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: basecamp-uploads.createupload
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
