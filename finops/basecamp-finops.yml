specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Basecamp
providerId: basecamp
publisherName: 37signals, LLC
serviceCategory: Collaboration / Project Management SaaS
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Collaboration
  - Project Management
  - SaaS
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Basecamp: tiered SaaS subscription with two billing shapes —
  per-user (Plus) and flat unlimited-seat (Pro Unlimited) — plus storage overage and add-on subscriptions.
  No per-API-call billing.'
sources:
  - https://basecamp.com/pricing
  - https://github.com/basecamp/bc3-api
principles:
  - name: Visibility
    description: 37signals invoices and receipts surface seat counts, storage usage, and add-on charges
      in the Basecamp account billing portal. There is no usage API; reconciliation relies on the monthly
      invoice line items.
  - name: Allocation
    description: Allocate spend by Basecamp account; cost can be split across teams via project-level
      attribution outside Basecamp (the API exposes project membership for chargeback modeling).
  - name: Optimization
    description: Compare Plus per-user math vs Pro Unlimited flat fee — Pro Unlimited becomes cheaper
      around 20+ active employee seats. Use annual billing on Pro Unlimited ($299/mo vs $349/mo monthly)
      and prune storage to avoid $50/TB overage.
  - name: Accountability
    description: Account owner is the billing contact; assign an internal Basecamp budget owner to review
      seat counts quarterly and remove inactive employees before each billing cycle.
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Refund
    - Credit
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Basecamp
  ServiceCategory: Collaboration / Project Management SaaS
  ProviderName: Basecamp
  PublisherName: 37signals, LLC
  InvoiceIssuerName: 37signals, LLC
  PricingCategory: Subscription
  PricingUnit: seat-month
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: seat_subscription
    description: Per-user monthly subscription on the Plus plan (employees only; guests free)
    unit: seat-month
    aggregation: sum
    dimensions:
      - account
      - plan
      - billing_period
  - name: flat_subscription
    description: Flat monthly subscription on the Pro Unlimited plan
    unit: month
    aggregation: sum
    dimensions:
      - account
      - billing_cycle
  - name: storage_included
    description: Storage included in the plan ceiling (Plus 500 GB, Pro Unlimited 5 TB)
    unit: GB-month
    aggregation: max
    dimensions:
      - account
      - plan
  - name: storage_overage
    description: Additional storage purchased above the plan ceiling
    unit: TB-month
    aggregation: sum
    dimensions:
      - account
  - name: addon_timesheet
    description: Timesheet add-on flat monthly fee (Plus only; included with Pro Unlimited)
    unit: month
    aggregation: sum
    dimensions:
      - account
  - name: addon_admin_pro_pack
    description: Admin Pro Pack add-on flat monthly fee (Plus only; included with Pro Unlimited)
    unit: month
    aggregation: sum
    dimensions:
      - account
apis:
  - name: Basecamp API
    baseURL: https://3.basecampapi.com
    tags:
      - Collaboration
      - Project Management
      - REST
      - Team Communication
    serviceName: Basecamp API
    serviceCategory: API
  - name: Basecamp Webhooks
    baseURL: https://3.basecampapi.com
    tags:
      - Events
      - Notifications
      - Project Management
      - Webhooks
    serviceName: Basecamp Webhooks
    serviceCategory: API
  - name: Basecamp OAuth
    baseURL: https://launchpad.37signals.com
    tags:
      - Authentication
      - Authorization
      - OAuth
      - Security
    serviceName: Basecamp OAuth
    serviceCategory: API
unitEconomics:
  - name: Cost per Active Seat
    metric: billed_cost / active_seats
    target: '<= $15/seat/month on Plus; switch to Pro Unlimited above ~20 seats'
  - name: Storage Cost Ratio
    metric: storage_overage_cost / total_billed
    target: minimize via retention policies
maintainers:
