description: Basecamp is a project management and team collaboration platform developed by 37signals. The Basecamp REST API
  (bc3-api) provides programmatic access to projects, to-do lists, messages, documents, schedules, and team members. OAuth2
  authentication via the 37signals Launchpad is required. The API returns JSON and is documented on GitHub at github.com/basecamp/bc3-api.
